@group(0) @binding(0) var<uniform> frame:Frame;
@group(1) @binding(0) var landRegional:texture_2d<f32>;
@group(1) @binding(1) var landTerritory:texture_2d<f32>;
@group(1) @binding(2) var landHarbour:texture_2d<f32>;
@group(1) @binding(3) var linearS:sampler;
@group(1) @binding(4) var sunDepth:texture_depth_2d;
@group(1) @binding(5) var sunSampler:sampler_comparison;
@group(1) @binding(6) var surveyColour:texture_2d_array<f32>;
@group(1) @binding(7) var skyMap:texture_2d<f32>;
@group(1) @binding(8) var windMap:texture_2d<f32>;

@group(1) @binding(10) var coastMap:texture_2d<f32>;
@group(2) @binding(0) var mirrorTex:texture_2d<f32>;
@group(2) @binding(1) var mirrorS:sampler;

struct Surf { @builtin(position) clip:vec4f, @location(0) pos:vec3f, @location(1) @interpolate(flat) style:u32 };
struct Build { @location(0) p:vec4i, @location(1) sector:u32 };
fn ferryPose(boat:u32,t:f32)->vec4f{
let a=vec2f(-342.,512.);let b=vec2f(375.,-120.);let f=fract(t/396.+select(.18,.69,boat==1u));

}
fn unpack(v:Build)->vec3f{
let t=vec2f(f32(i32(v.sector&255u)-128),f32(i32((v.sector>>8u)&255u)-128))*1024.;

let material=u32(v.p.w)&63u;if(material>=30u&&material<=32u){
let boat=u32(v.p.w)>>6u;let at=ferryPose(boat,frame.eye.w);let side=vec2f(-at.w,at.z);
let loc=at.xy+side*p.x+at.zw*p.z;return vec3f(loc.x,p.y+.08*sin(frame.eye.w*.79+f32(boat)),loc.y);

fn clip(p:vec3f,mirror:bool)->vec4f{

fn shadowPos(p:vec3f)->vec4f{

@vertex fn building(v:Build)->Surf{let p=unpack(v);return Surf(clip(p,false),p,u32(v.p.w));}

@vertex fn shadowTerrain(@location(0) p:vec3f)->@builtin(position) vec4f{return shadowPos(p);}

struct PhotoIn{@location(0) xyz:vec4i,@location(1) uv:vec2f};
struct PhotoOut{@builtin(position) clip:vec4f,@location(0) p:vec3f,@location(1) uv:vec2f,@location(2) @interpolate(flat) layer:u32};
fn photoPos(v:PhotoIn)->vec3f{return vec3f(v.xyz.xyz)*vec3f(.25,.0625,.25);}
fn offshore(p:vec3f)->bool{
let uv=(p.xz+vec2f(3301.,1801.))/vec2f(5802.,5302.);
if(p.y>18.||min(uv.x,uv.y)<0.||max(uv.x,uv.y)>1.){return false;}

@vertex fn photoVertex(v:PhotoIn)->PhotoOut{let p=photoPos(v);return PhotoOut(clip(p,false),p,v.uv,u32(v.xyz.w));}

@vertex fn photoShadow(v:PhotoIn)->@builtin(position) vec4f{return shadowPos(photoPos(v));}

@fragment fn photoMirror(i:PhotoOut)->@location(0) vec4f{

fn litShadow(p:vec3f,n:vec3f)->f32{
let s=shadowPos(p+n*1.65+sun*.8);let uv=s.xy*vec2f(.5,-.5)+.5;

let a=textureSampleCompareLevel(sunDepth,sunSampler,uv+vec2f(-.80,-.34)*sz,cmpDepth);

fn atmosphere(c:vec3f,d:f32,ray:vec3f)->vec3f{

fn sky(ray:vec3f)->vec3f{

return textureSampleLevel(skyMap,linearS,vec2f(u,clamp(v,.001,.999)),0.).rgb;

fn scanLight(photo:vec3f,p:vec3f,n:vec3f,ray:vec3f)->vec3f{

let radial=normalize(vec3f(p.x+563.5,.0001,p.z-785.));let smoothN=normalize(mix(radial,n,.29));

let gl=mix(vec3f(.172,.226,.274),e,.36+.14*pow(1.-max(0.,dot(-ray,smoothN)),3.));

let panels=mix(gl,trim,max(mullion*.91,rail*.85))*(.91+.09*sh);

}

}
fn landColor(p:vec3f)->vec3f{
let u=(p.xz+vec2f(122940.))/(2049.*120.);
var c=textureSample(landRegional,linearS,u).rgb;
let v=(p.xz+vec2f(35010.,31010.))/vec2f(63760.,48020.);
if(min(v.x,v.y)>0.&&max(v.x,v.y)<1.){c=textureSample(landTerritory,linearS,v).rgb;}
let h=(p.xz+vec2f(6504.,7004.))/vec2f(14208.,11528.);
if(min(h.x,h.y)>0.&&max(h.x,h.y)<1.){let edge=clamp(min(min(h.x,h.y),min(1.-h.x,1.-h.y))*60.,0.,1.);c=mix(c,textureSample(landHarbour,linearS,h).rgb,edge);}

fn linemarks(v:f32,width:f32)->f32{
let deriv=max(.002,fwidth(v));let edge=min(fract(v),1.-fract(v));
return (1.-smoothstep(width-deriv*.45,width+deriv*.45,edge))*(1.-smoothstep(.32,.83,deriv));

fn facade(p:vec3f,n:vec3f,eye:vec3f,code:u32)->vec3f{
let m=code&63u;let sd=f32(code>>6u)/255.;let ray=normalize(p-eye);

if(m==27u){return vec3f(.79,.804,.79)+gloss*.16;}
if(m==28u){return vec3f(.63,.112,.114);}
if(m==30u){return vec3f(.062,.263,.174);}
if(m==31u){return vec3f(.115,.167,.163);}
if(m==32u){return vec3f(.895,.879,.798);}
if(m==33u){return select(vec3f(.352,.343,.322),vec3f(.557,.554,.528),n.y>.55);}

if(m==12u||m==13u){return vec3f(.853,.866,.850);}

}
if(m==12u||m==13u){return vec3f(.827,.848,.836)+.06*gloss;}
if(m==14u){return vec3f(.765,.616,.408);}
if(m==15u){let stone=linemarks(p.y/3.6,.09);let clock=1.-smoothstep(1.6,1.92,length(vec2f(fract(across/7.25+.5)*7.25-3.625,p.y-30.5)));return mix(mix(vec3f(.59,.351,.260),vec3f(.81,.754,.638),stone),vec3f(.94,.914,.763),clock);}

@fragment fn solid(i:Surf)->@location(0) vec4f{
if(i.style==0u&&offshore(i.pos)){discard;}

struct Screen{@builtin(position) p:vec4f,@location(0) ndc:vec2f};
